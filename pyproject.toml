[build-system]
requires = ["setuptools>=68.0", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "distsfactory"
version = "0.1.0"
description = "Construct probability distributions from partial specifications (moments, quantiles, mode, etc.)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Ron Ashri" },
    { name = "Sarat Moka" },
    { name = "Yoni Nazarathy", email = "yoni@accumulationpoint.com" },
]
dependencies = [
    "scipy>=1.11",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]
docs = [
    "mkdocs>=1.5",
    "mkdocs-material>=9.0",
    "mkdocstrings[python]>=0.24",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
